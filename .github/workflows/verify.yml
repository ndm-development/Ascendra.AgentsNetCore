name: Verify Ascendra Agents .NET

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Ascendra.AgentsNetCore.sln
      - run: dotnet build Ascendra.AgentsNetCore.sln --configuration Release --no-restore
