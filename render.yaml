services:
  - type: web
    name: ascendra-agents-netcore
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Security__AllowLocalPreview
        value: "false"
      - key: ASCENDRA_AGENT_CREDENTIALS_JSON
        sync: false
