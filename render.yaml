services:
  - type: web
    name: ascendra-agents-netcore
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ascendra-agents-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Security__AllowLocalPreview
        value: "false"
      - key: ASCENDRA_AGENT_CREDENTIALS_JSON
        sync: false
      - key: Security__DataProtectionPath
        value: /app/data/keys
      - key: Data__InputPath
        value: /app/data/input
      - key: Data__GeneratedPath
        value: /app/data/generated
